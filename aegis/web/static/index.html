<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aegis EDR — Console</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Login gate -->
  <div id="login-view" class="login-wrap">
    <form id="login-form" class="login-card" autocomplete="off">
      <div class="brand">AEGIS <span>EDR</span></div>
      <p class="muted">Paste your API token (found in <code>~/.aegis/api_token</code>).</p>
      <input id="token-input" type="password" placeholder="API token" required minlength="32">
      <button type="submit">Authenticate</button>
      <p id="login-error" class="error" hidden>Invalid token — access denied.</p>
    </form>
  </div>

  <!-- Console -->
  <div id="console-view" hidden>
    <header class="topbar">
      <div class="brand">AEGIS <span>EDR</span></div>
      <div class="topbar-right">
        <span id="host-label" class="muted"></span>
        <button id="scan-btn" class="primary">Run scan</button>
        <button id="logout-btn">Log out</button>
      </div>
    </header>

    <main>
      <section class="cards" id="stat-cards">
        <div class="card"><div class="card-num" id="stat-total">–</div><div class="card-label">Total alerts</div></div>
        <div class="card sev-critical"><div class="card-num" id="stat-critical">–</div><div class="card-label">Critical</div></div>
        <div class="card sev-high"><div class="card-num" id="stat-high">–</div><div class="card-label">High</div></div>
        <div class="card sev-medium"><div class="card-num" id="stat-medium">–</div><div class="card-label">Medium</div></div>
        <div class="card sev-low"><div class="card-num" id="stat-low">–</div><div class="card-label">Low</div></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Alerts</h2>
          <select id="severity-filter">
            <option value="">All severities</option>
            <option value="critical">Critical+</option>
            <option value="high">High+</option>
            <option value="medium">Medium+</option>
            <option value="low">Low+</option>
          </select>
        </div>
        <table>
          <thead><tr><th>Time (UTC)</th><th>Severity</th><th>Rule</th><th>Detection</th><th>Subject</th><th>MITRE</th></tr></thead>
          <tbody id="alerts-body"></tbody>
        </table>
        <p id="alerts-empty" class="muted" hidden>No alerts recorded yet.</p>
      </section>

      <div class="grid-2">
        <section class="panel">
          <div class="panel-head"><h2>Detection rules</h2></div>
          <table>
            <thead><tr><th>ID</th><th>Name</th><th>Severity</th><th>ATT&amp;CK</th></tr></thead>
            <tbody id="rules-body"></tbody>
          </table>
        </section>

        <section class="panel">
          <div class="panel-head"><h2>IOC feed</h2></div>
          <form id="ioc-form" class="ioc-form" autocomplete="off">
            <select id="ioc-category">
              <option value="ip">IP</option>
              <option value="domain">Domain</option>
              <option value="sha256">SHA-256</option>
            </select>
            <input id="ioc-value" type="text" placeholder="indicator value" required maxlength="256">
            <button type="submit" class="primary">Add</button>
          </form>
          <p id="ioc-error" class="error" hidden></p>
          <div id="ioc-list"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
