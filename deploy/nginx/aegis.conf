# Aegis EDR — TLS-terminating reverse proxy (nginx)
#
# nginx owns HTTPS and forwards to the Aegis app on loopback. The app stays
# bound to 127.0.0.1:8765 and never sees raw internet traffic.
#
# Quick start (lab):
#   sudo deploy/nginx/gen-dev-cert.sh
#   sudo cp deploy/nginx/aegis.conf /etc/nginx/sites-available/aegis
#   sudo ln -s /etc/nginx/sites-available/aegis /etc/nginx/sites-enabled/
#   python -m aegis serve --secure-cookies
#   sudo nginx -t && sudo systemctl reload nginx
#
# Production: replace the snakeoil cert with a real one (Let's Encrypt:
# `certbot --nginx -d aegis.example.com` handles most of this file for you).

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # --- TLS -------------------------------------------------------------
    ssl_certificate     /etc/ssl/certs/aegis-dev.crt;
    ssl_certificate_key /etc/ssl/private/aegis-dev.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;              # TLS 1.3 ciphers are all strong
    ssl_session_cache shared:AEGIS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: browsers must use HTTPS for the next year after first visit.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Defense-in-depth headers (the app sets these too; nginx guarantees them
    # even if the app or an error page forgets).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 1m;                    # the app never accepts big uploads
    server_tokens off;

    # --- Rate limiting at the edge (second layer, per real client IP) ------
    limit_req_zone $binary_remote_addr zone=aegis_login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=aegis_api:10m rate=60r/m;

    location /login {
        limit_req zone=aegis_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8765;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=aegis_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8765;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# Plain HTTP only ever redirects to HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
